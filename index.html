<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思有引力 · 伦理立场</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap');
:root{--paper:#fff;--card:#fff;--ink:#1c1a17;--muted:#5e574e;--line:#1c1a17;--red:#d7382e;--yellow:#f2c84b;--green:#1e8a46;--cyan:#0e7f99;--blue:#2c46c9;--purple:#6a35b0;--clay:#c4492a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#f6f1e8 center/cover no-repeat fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin-top:0}
.serif{font-family:'Noto Serif SC',serif}
.app{min-height:100vh;display:flex}
.sidebar{width:212px;position:sticky;top:0;height:100vh;padding:26px 16px;background:var(--ink);color:#f6f0e4;display:flex;flex-direction:column}
.brand{font-family:'Noto Serif SC',serif;font-size:28px;line-height:1.15;font-weight:700}
.tagline{margin:8px 0 28px;font-family:Fraunces,serif;font-size:12px;letter-spacing:2px;color:#f2c84b}
.nav{display:block;width:100%;text-align:left;padding:11px 10px;margin:2px 0;border:0;background:transparent;color:#f6f0e4;font-size:15px}
.nav.active{background:var(--yellow);color:var(--ink);font-weight:700}
.sidebar-bottom{margin-top:auto;font-size:12px;line-height:1.7;color:#c9c0b2}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8d867c;margin-right:6px}
.online-dot.on{background:#8dce78}
.main{flex:1;min-width:0}
.top{min-height:64px;padding:14px 36px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.9)}
.top small{font-family:Fraunces,serif;letter-spacing:1px}
.coin{background:var(--ink);color:var(--yellow);padding:6px 10px;font-size:13px}
.keyform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.keyform input{flex:1;min-width:180px;border:2px solid var(--ink);background:#fff;padding:8px 10px}
.tape{display:inline-block;background:var(--ink);color:#f6f0e4;padding:4px 8px;font-family:Fraunces,serif;font-size:12px;letter-spacing:2px;font-weight:700}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:#fff;border:2px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:28px 32px;overflow:visible}
.hero-copy{position:relative;z-index:2}
.paper-wrap{position:relative;width:100%;display:flex;justify-content:center;flex:1;perspective:1600px}
.paper-nav{position:absolute;top:36vh;z-index:3;width:54px;height:54px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:0 6px 18px rgba(28,26,23,.16);color:var(--ink);font-family:Fraunces,serif;font-size:30px;line-height:1;display:grid;place-items:center;backdrop-filter:blur(4px)}
.paper-nav:hover{background:rgba(255,255,255,.88)}
.paper-nav.prev{left:max(8px,calc(50% - 600px))}
.paper-nav.next{right:max(8px,calc(50% - 600px))}
.paper-hint{margin:8px 0 0;text-align:center;font-family:Fraunces,serif;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.news{color:var(--ink);background:#f3efe4;padding:22px 36px 40px;display:flex;flex-direction:column;width:min(1120px,calc((100vh - 64px) * 297 / 210),calc(100% - 120px));min-height:calc(100vh - 64px);margin:0 auto;align-self:center;box-shadow:0 18px 48px rgba(28,26,23,.16);touch-action:pan-y;transform-style:preserve-3d}
.news.dragging{user-select:none;cursor:grabbing}
.mast{text-align:center;padding:6px 4px 0}
.mast-en{margin:0;font-family:Fraunces,serif;letter-spacing:.38em;font-size:11px;text-transform:uppercase}
.mast h1{font-family:'Noto Serif SC',serif;font-size:64px;letter-spacing:.34em;line-height:1;margin:2px 0 8px;text-indent:.34em;font-weight:700}
.mast-rule{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);height:5px;margin:0}
.mast-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px;padding-bottom:6px;border-bottom:1px solid var(--ink);font-family:Fraunces,serif;font-size:12px;letter-spacing:.06em}
.mast-actions{margin:0;gap:18px}
.mast-actions button{background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--ink);box-shadow:none;padding:0 0 1px;font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700}
.faces-line{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0 0;padding-bottom:8px;border-bottom:1px solid rgba(28,26,23,.4)}
.faces-cap{flex:none;white-space:nowrap;font-family:Fraunces,serif;font-size:11px;letter-spacing:.18em}
.faces-line img{width:34px;height:44px;object-fit:cover;object-position:center 12%;filter:grayscale(1) contrast(1.08);background:transparent}
.lead{margin:16px 0 0;padding-bottom:14px;border-bottom:3px double rgba(28,26,23,.72);display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,250px);gap:18px 28px;align-items:start}
.lead-main{min-width:0}
.kicker{font-family:Fraunces,serif;letter-spacing:.16em;font-size:14px;margin:0 0 6px}
.lead h2{font-family:'Noto Serif SC',serif;font-size:46px;line-height:1.25;margin:0 0 8px;font-weight:700;text-wrap:balance}
.deck{font-family:'Noto Serif SC',serif;font-size:22px;line-height:1.6;margin:0 0 12px;text-wrap:balance}
.lead-copy{column-count:1;column-gap:28px;column-rule:1px solid rgba(28,26,23,.28);column-fill:balance;font-family:'Noto Serif SC',serif;font-size:19px;line-height:1.85;text-align:justify}
.lead-copy p{margin:0}
.lead-copy p::first-letter{float:left;font-size:3.1em;line-height:.82;padding:4px 8px 0 0;font-weight:700}
.lead-open{margin-top:14px;background:transparent;border:0;border-bottom:1px solid var(--ink);box-shadow:none;padding:0;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700}
.lead-cast{display:flex;flex-direction:column;gap:16px;align-items:center}
.lead-face{display:flex;flex-direction:column;align-items:center;width:100%;border:0;background:transparent;padding:0;color:var(--ink)}
.lead-face img{width:100%;height:280px;object-fit:contain;object-position:center top;filter:grayscale(1) contrast(1.08);background:transparent}
.lead-cast.many .lead-face img{height:188px}
.lead-name{font-family:'Noto Serif SC',serif;font-size:28px;line-height:1.15;margin-top:2px}
.lead-meta{font-family:Fraunces,serif;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.folio{margin-top:16px;flex:1}
.folio-label{margin:0 0 12px;padding-bottom:4px;border-bottom:1px solid var(--ink);font-family:Fraunces,serif;letter-spacing:.22em;font-size:14px}
.stories{column-width:240px;column-count:4;column-gap:28px;column-rule:1px solid rgba(28,26,23,.3);column-fill:balance}
.story{display:block;width:100%;break-inside:avoid;margin:0 0 16px;padding:0 0 12px;border:0;border-bottom:1px solid rgba(28,26,23,.16);background:transparent;box-shadow:none;text-align:left;font-family:'Noto Serif SC',serif}
.story .kicker{display:block;font-size:13px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.story strong{display:block;font-size:21px;line-height:1.35;margin-bottom:6px}
.story .ask{display:block;font-size:16px;line-height:1.65}
.hero h1{font-family:'Noto Serif SC',serif;font-size:42px;line-height:1.22;margin:12px 0}
.hero p{font-size:15px;line-height:1.75;color:var(--muted);max-width:560px}
.cuts{display:grid;grid-template-columns:repeat(4,68px);gap:8px;margin:0;position:relative;z-index:2}
.cut{position:relative;width:68px;height:86px;overflow:hidden;border:3px solid #fff;box-shadow:4px 4px 0 rgba(28,26,23,.22);background:#fff}
.cut img,.poster .face,.profile-card .portrait{object-fit:cover;object-position:center 12%;display:block;background:#fff}
.cut img{width:100%;height:100%}
.content{max-width:1120px;margin:0 auto;padding:24px 28px 56px}
body.front .main{display:flex;flex-direction:column;min-height:100vh}
body.front .content{flex:1;display:flex;flex-direction:column;align-items:center;max-width:none;width:auto;margin:0;padding:0;background:transparent}
.primary,.outline,.small{border:2px solid var(--ink);padding:11px 16px;background:#fff}
.primary{background:var(--ink);color:#f6f0e4;box-shadow:4px 4px 0 var(--red);font-weight:700}
.small{padding:8px 12px;font-size:13px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 0 12px}
.sectionhead h2{font-family:'Noto Serif SC',serif;font-size:26px;margin:0}
.sectionhead span{font-family:Fraunces,serif;font-size:13px;letter-spacing:1px}
.issue-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.scatter{position:relative;height:980px}
.scatter .poster{position:absolute;width:228px;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.scatter .poster:nth-child(1){top:6px;left:0;transform:rotate(-7deg)}
.scatter .poster:nth-child(2){top:54px;left:34%;transform:rotate(5deg)}
.scatter .poster:nth-child(3){top:0;right:0;transform:rotate(-3deg)}
.scatter .poster:nth-child(4){top:360px;left:2%;transform:rotate(4deg)}
.scatter .poster:nth-child(5){top:410px;left:38%;transform:rotate(-6deg)}
.scatter .poster:nth-child(6){top:340px;right:2%;transform:rotate(3deg)}
.scatter .poster:nth-child(7){top:700px;left:18%;transform:rotate(-2.5deg)}
.scatter .poster:hover{transform:rotate(0deg) translateY(-12px) scale(1.04);box-shadow:12px 16px 0 var(--ink);filter:brightness(1.08);z-index:5}
.scatter .poster .face{transition:transform .18s ease}
.scatter .poster:hover .face{transform:rotate(3deg) scale(1.05)}
.poster{min-height:0;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 36px 14px 14px;position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.poster.inked{color:var(--ink)}
.school-tag{position:absolute;top:8px;right:8px;z-index:3;background:#fff;color:#1c1a17;border:2px solid #1c1a17;padding:3px 6px;font-size:11px;line-height:1.2;font-weight:700}
.poster .vname{position:absolute;top:40px;right:8px;writing-mode:vertical-rl;letter-spacing:2px;font-family:Fraunces,serif;font-size:12px;font-weight:700}
.poster .tick{position:absolute;right:10px;bottom:10px;z-index:4;width:28px;height:28px;border-radius:50%;background:#1c1a17;color:#f6f0e4;display:grid;place-items:center}
.poster .tick svg{display:block}
.poster .face{width:108px;height:140px;margin-bottom:14px;border:3px solid #fff;box-shadow:4px 5px 0 rgba(0,0,0,.22);transform:rotate(-4deg)}
.mini{width:48px;height:62px;object-fit:cover;object-position:center 12%;border:2px solid var(--ink);vertical-align:middle;margin-right:8px;background:#fff}
.poster h3{font-family:'Noto Serif SC',serif;font-size:28px;margin:0 0 4px}
.poster p{margin:0;font-size:13px;line-height:1.5}
.issue{position:relative;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:0;text-align:left;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.issue-body{display:flex;flex-direction:column;flex:1;padding:14px;background:#fff}
.issue h3{font-family:'Noto Serif SC',serif;font-size:18px;line-height:1.35;margin:8px 0}
.issue p{color:var(--muted);font-size:13px;line-height:1.65;margin-bottom:0}
.layout2{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;align-items:start}
.panel{background:#fff;border:2px solid var(--ink);padding:22px}
.panel h2{font-family:'Noto Serif SC',serif;font-size:26px}
.muted{color:var(--muted);font-size:14px;line-height:1.8}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode{border:2px solid var(--ink);background:#fff;padding:16px;text-align:left}
.mode.active{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}
.workspace .mode{border:1px solid rgba(28,26,23,.2);background:rgba(255,255,255,.66);box-shadow:none}
.workspace .mode.active{background:rgba(242,200,75,.88);box-shadow:none}
.mode strong{display:block;font-family:'Noto Serif SC',serif;font-size:20px}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice{text-align:left;border:1px solid rgba(28,26,23,.22);background:rgba(255,255,255,.62);padding:12px 14px;line-height:1.6;font-size:15px;box-shadow:none}
.choice:hover{background:var(--yellow)}
.chat{height:auto;min-height:180px;max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:#fff;border:2px solid var(--ink);margin:10px 0}
.bubble{max-width:88%;background:#fff;border:2px solid var(--ink);padding:12px 14px;font-size:14px;line-height:1.8;white-space:pre-wrap;box-shadow:4px 4px 0 rgba(28,26,23,.12)}
.bubble.user{align-self:flex-end;background:var(--yellow)}
.bubble .by{display:block;font-size:11px;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.send{display:flex;gap:8px;align-items:stretch}
.send textarea{flex:1;min-height:68px;border:2px solid var(--ink);background:#fff;padding:10px;resize:vertical}
.discussion{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cast{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--ink);background:#fff;padding:8px 10px;font-size:13px;text-align:left}
.chip.on{background:var(--ink);color:#f6f0e4}
.meter{height:8px;background:#eee;border:1px solid var(--ink)}
.meter>i{display:block;height:100%;background:var(--red)}
.legend{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.profile{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.profile-card{min-height:420px;border:2px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:22px;color:#fff;position:sticky;top:16px}
.profile-card.inked{color:var(--ink)}
.profile-card .portrait{width:200px;height:260px;margin:16px 0;border:3px solid #fff;box-shadow:6px 8px 0 rgba(0,0,0,.22)}
.profile-card h2{font-family:'Noto Serif SC',serif;font-size:36px;margin:0}
.dossier h3{font-family:'Noto Serif SC',serif;font-size:18px;border-top:2px solid var(--ink);padding-top:12px;margin:18px 0 8px}
.dossier p{line-height:1.85;font-size:15px}
.works{padding-left:18px;line-height:1.8}
.radar{max-width:460px;margin:4px 0 8px}
.radar svg{width:100%;height:auto;display:block}
.era{position:relative;background:#fff;border:2px solid var(--ink);border-left:8px solid var(--red);padding:12px 14px;margin:12px 0}
.day-issue{position:relative}
body.arena{overflow:hidden;height:100vh}
body.arena .app{height:100vh;min-height:0;overflow:hidden}
body.arena .main{height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.arena .content{flex:1;min-height:0;max-width:none;width:auto;margin:0;padding:4px 16px 8px;display:flex;overflow:hidden}
body.test-gate{background-color:#fff;background-image:none;overflow:hidden;height:100vh}
body.test-gate .app{height:100vh;min-height:0}
body.test-gate .main{height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.test-gate .content{position:relative;flex:1;min-height:0;max-width:none;width:auto;margin:0;padding:4vh 0 0;background:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.test-hero{position:relative;z-index:1;width:min(880px,calc(100% - 48px));flex:none;text-align:center;color:var(--ink)}
.test-stage{position:absolute;z-index:0;left:0;right:0;bottom:0;pointer-events:none}
.test-stage img{width:100%;height:auto;display:block}
.test-hero h1{font-family:'Noto Serif SC',serif;font-size:clamp(36px,4.6vw,58px);font-weight:700;line-height:1.25;margin:0 0 14px}
.test-en{font-family:Fraunces,serif;font-size:clamp(22px,2.6vw,34px);margin:0 0 34px}
.test-picks{display:flex;justify-content:center;align-items:flex-start;gap:56px;flex-wrap:wrap}
.test-pick{display:flex;flex-direction:column;align-items:center;gap:12px}
.test-pick>span{font-size:15px;font-weight:700;border-bottom:1px solid var(--ink);line-height:1.4}
.test-opts{display:flex;gap:14px}
.test-opt{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 22px;font-size:17px;line-height:1.3}
.test-opt.on{background:var(--ink);color:#f6f0e4}
.test-go{margin-top:26px;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:0 2px 2px;font-family:'Noto Serif SC',serif;font-size:clamp(26px,3vw,36px);font-weight:700}
@media(max-width:720px){
body.test-gate .content{padding:28px 0 0}
.test-stage{bottom:76px}
.test-picks{gap:28px}
.test-en{margin-bottom:22px}
}
.round{position:relative;flex:1;width:100%;height:100%;min-height:0;margin:0;overflow:hidden}
.round-seat{position:absolute;z-index:1;width:calc(var(--s) * clamp(168px,16vw,280px));margin-left:calc(var(--s) * clamp(-84px,-8vw,-140px));margin-top:calc(var(--s) * -16px);border:0;background:transparent;padding:0;color:var(--ink);mix-blend-mode:multiply}
.round-seat .bust{display:block}
.round-seat img{width:100%;height:calc(var(--s) * clamp(210px,20vw,340px));object-fit:cover;object-position:center 8%;display:block;filter:grayscale(1) contrast(1.06);background:transparent;-webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%)}
.round-pill{position:absolute;z-index:4;transform:translate(-50%,0);margin-top:calc(var(--s) * clamp(78px,8vw,120px));white-space:nowrap;background:#f7f1e6;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;line-height:1.3;box-shadow:3px 3px 0 rgba(28,26,23,.14);color:var(--ink)}
.round-pill.on{background:var(--yellow)}
.round-pill.high{margin-top:calc(var(--s) * clamp(18px,2vw,36px))}
.round-seat:hover{margin-top:calc(var(--s) * -24px)}
.round-table{position:absolute;z-index:2;left:0;right:0;top:24%;bottom:0;background:#f4efe4;border:3px solid var(--ink);border-bottom:0;border-radius:50% 50% 0 0 / 46% 46% 0 0;box-shadow:0 16px 36px rgba(28,26,23,.1);display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 8% 12px;overflow:hidden}
.round-table h2{font-family:'Noto Serif SC',serif;font-size:clamp(28px,3vw,42px);line-height:1.25;margin:8px 0;max-width:min(980px,88%);flex:none}
.round-who{margin:0 0 8px;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;flex:none}
.round-line{margin:0;width:min(980px,90%);flex:1;min-height:0;overflow:auto;font-family:'Noto Serif SC',serif;font-size:18px;line-height:1.7}
.round-line.wait{color:var(--muted)}
.round-mine{margin:8px 0 0;width:min(920px,86%);font-size:16px;line-height:1.5;color:var(--muted);flex:none}
.round-send{display:flex;gap:8px;width:min(920px,86%);margin-top:10px;flex:none}
.round-send textarea{flex:1;height:76px;min-height:76px;max-height:76px;resize:none;border:2px solid var(--ink);background:rgba(255,255,255,.72);padding:12px 14px;font-size:18px}
.round-adjust{margin-top:8px;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:0;font-family:'Noto Serif SC',serif;font-size:16px;flex:none}
.arena-board{display:grid;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);grid-template-areas:'top top top' 'left table right' 'bottom bottom bottom';gap:16px 14px;align-items:center;margin:8px 0 16px}
.lane-top{grid-area:top;display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.lane-left{grid-area:left;display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:stretch;min-width:0}
.lane-right{grid-area:right;display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:stretch;min-width:0}

<body>
<div class="app">

</aside>
<main class="main">
  <header class="top"><small>YOU ARE INVITED / 伦理立场实验室</small><span class="coin">✦ <span id="coinTop">0</span> 思想火花</span></header>

<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const SHOW=['kant','noddings','bentham','aristotle','scanlon','gilligan','mill'];
function lineup(){return SHOW.map(person)}
function posterCard(p,onclick,mark){return `<button class="poster ${p.on==='#1c1a17'?'inked':''}" style="background:${p.color};color:${p.on}" onclick="${onclick}"><span class="school-tag">${p.school}</span><span class="vname">${mark||p.en}</span><img class="face" src="${p.img}" alt="${p.person}"><h3>${p.person}</h3><p>${p.years}</p><p>${p.keys.join(' · ')}</p></button>`}
const BASE=[
{id:'bentham',img:'img/character/2-边沁.svg',person:'边沁',en:'BENTHAM',school:'功利主义',years:'1748–1832',color:'#d7382e',on:'#fff',keys:['总体幸福','每个人算一份','苦乐'],
identity:'英国法学家、社会改革者，古典功利主义的主要陈述者。他一生大部分时间在推动法律、监狱和选举改革，而不是在大学里讲课。',
ideas:'道德上对的行为，是在受影响的人中间带来最大幸福的行为。快乐和痛苦可以按强度、持续时间、确定程度和远近加以比较，这套办法常被叫做幸福计算。他强调每个人都算一份，不因身份加码。他不太区分快乐的“高雅”和“低级”，这一点后来被密尔改写。',
works:['《道德与立法原理导论》（1789）','《政府片论》'],
anecdote:'他留下遗嘱，希望死后以“自体圣像”的方式留在伦敦大学学院。现在人们见到的是骨架配上蜡制头像，真头因为保存失败被另行存放。会议纪录里有时会戏称他“出席但未投票”。这是学院至今还在讲的事，不是道德论证本身。',
voice:'先把受影响的人一一列出来，问哪种做法让痛苦的总量更小。不要先谈谁更配得。用户如果只顾一个人的委屈，提醒还有谁被漏出账本。不要假装快乐都能精确打分，但要坚持比较必须公开。',
hello:'把这件事里会疼的人先点名。晋升、工资、监控或一台设备，我都想先看总体少受多少苦。你要算的是哪一笔账？'},
{id:'mill',img:'img/character/4-密尔.svg',person:'密尔',en:'MILL',school:'功利主义',years:'1806–1873',color:'#f2c84b',on:'#1c1a17',keys:['伤害原则','高级快乐','个体自由'],
identity:'英国哲学家、经济学家，一度担任国会议员。他在边沁和自己父亲詹姆斯·密尔的功利主义传统里长大，后来把这个传统改得更重视自由、个性和讨论。',
ideas:'他仍以幸福为道德标准，但认为快乐有种类之别：运用理智、想象和同情的生活，不同于只求安逸的刺激。在《论自由》里，他为思想、言论和生活方式留出空间，限制自由的主要理由是防止伤害他人，而不是因为多数人不喜欢。他也论证妇女应享有同等的公民资格。',
works:['《论自由》（1859）','《功利主义》（1863）','《妇女的屈从地位》（1869）'],
anecdote:'他幼年就被安排高强度学习，二十岁前后经历过一次严重的精神崩溃，后来把读诗当作恢复感受力的一部分。《论自由》题献给哈丽雅特·泰勒，密尔明确说书中不少想法来自两人长期的共同讨论。1867年他在国会提出修正，希望选举权条文里的“男人”改为“人”，修正案没有通过。',
voice:'同时看幸福和自由。片刻的安全或利润，不等于一种能够发展自身能力的生活。若多数人的方便建立在某个人无法退出的伤害上，要停下来。用户把两种快乐当成同一种时，请他分辨。',
hello:'边沁会先加总。我会多问一句：这种幸福会不会把某个人的生活压扁，而且对方无法拒绝。你想谈的是哪一种压法？'},
{id:'kant',img:'img/character/1-康德.svg',person:'康德',en:'KANT',school:'义务论',years:'1724–1804',color:'#2c46c9',on:'#fff',keys:['绝对命令','人是目的','义务'],
identity:'普鲁士哲学家，几乎一生住在柯尼斯堡。他同时写知识、道德、宗教和法权，道德哲学的核心文本是《道德形而上学奠基》。',
ideas:'一个行为的道德价值不看它带来多少好处，而看它是否出自对道德法则的尊重。绝对命令的一种表述是：只按你能够愿意它成为普遍法则的准则去行动。另一种表述是：永远把人性当作目的，而不仅仅当作手段。人可以被雇用、被治疗、被安排岗位，但不能被只当成别人目标的工具。幸福值得希望，却不能充当“所以可以这样对待人”的理由。',
works:['《纯粹理性批判》','《实践理性批判》','《道德形而上学奠基》（1785）'],
anecdote:'关于他每日散步准时到可以让邻居对表，是流传很广的轶事，不必当成考据过的时钟实验。更值得记住的是他很少离开自己的城市，却坚持道德法则要对每一个理性存在者有效，而不是只对熟人有效。',
voice:'先不要比较哪种结果更划算。问这条做法能不能被公开成所有人都遵守的规则，以及有没有人被仅仅当成工具。用户用“为了大家好”压过某一个人时，把那个人单独拎出来。',
hello:'在问谁更受益之前，我想知道有没有人只是被拿来用。你现在面对的是规则、晋升，还是一台只够救一个人的设备？'},
{id:'aristotle',img:'img/character/3-亚里士多德.svg',person:'亚里士多德',en:'ARISTOTLE',school:'德性伦理',years:'公元前384–前322',color:'#1e8a46',on:'#fff',keys:['实践智慧','中道','品格'],
identity:'古希腊哲学家，柏拉图的学生，曾教过亚历山大大帝，后来在雅典吕克昂讲学、研究。传到今天的伦理学著作，很多是讲课传统留下的整理，不是一本一次性写成的手册。',
ideas:'他追问的是怎样才算一个过得好的人，而不只是哪一个行为单独算对。繁荣的生活要运用理性，并在具体处境里找到过度与不足之间的中道。勇敢、公正、慷慨都是品格，靠习惯长成，也靠实践智慧判断这一次该怎么做。人在他看来是城邦中的动物：单独计算个人快感，漏掉了共同生活本身要培养的能力。',
works:['《尼各马可伦理学》','《政治学》','《修辞学》'],
anecdote:'吕克昂的人常被叫做逍遥学派，和一边走动一边讨论的教学方式有关。后来他离开雅典时，古代记载留下这样一层意思：他不愿让雅典人对哲学再犯一次罪。这是转述，不是一块幸存的碑。',
voice:'不要把对立的两个选项当成全部。问这个实践——工作、家庭、城邦——本来在培养什么样的人，这一次是太紧、太松，还是刚好让人做得成一件值得反复做的事。少下抽象定义，多问习惯。',

function bindPaper(el){
  if(el.dataset.bound)return;
  el.dataset.bound='1';
  let x0=null,dx=0,active=false,pid=null,moved=false;
  el.addEventListener('pointerdown',e=>{
    if(e.button!=null&&e.button!==0)return;
    paperAnim++;
    x0=e.clientX;dx=0;active=true;moved=false;pid=e.pointerId;
    el._y0=e.clientY;
  });
  el.addEventListener('pointermove',e=>{
    if(!active||e.pointerId!==pid)return;
    dx=e.clientX-x0;
    const dy=e.clientY-el._y0;
    if(!moved){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(Math.abs(dy)>Math.abs(dx)){active=false;x0=null;return}
      moved=true;
      el.classList.add('dragging');
      try{el.setPointerCapture(pid)}catch(err){}
    }
    const w=el.getBoundingClientRect().width||1;
    const ang=Math.max(-78,Math.min(78,dx/w*80));
    el.style.transition='none';
    el.style.transformOrigin=dx<0?'left center':'right center';
    el.style.transform='rotateY('+ang+'deg)';
  });
  const finish=e=>{
    if(!active||(e&&e.pointerId!=null&&e.pointerId!==pid))return;
    active=false;
    el.classList.remove('dragging');
    if(moved&&Math.abs(dx)>64){
      const dir=dx<0?1:-1;
      const token=++paperAnim;
      el.style.transition='transform .42s ease';
      el.style.transformOrigin=dir>0?'left center':'right center';
      el.style.transform='rotateY('+(dir>0?-88:88)+'deg)';
      const done=()=>{if(token!==paperAnim)return;paperAnim++;shiftPaper(dir)};
      el.addEventListener('transitionend',done,{once:true});
      setTimeout(done,500);
    }else{
      el.style.transition='transform .28s ease';
      el.style.transform='rotateY(0deg)';
    }
    if(moved){
      const stop=ev=>{ev.preventDefault();ev.stopPropagation();el.removeEventListener('click',stop,true)};
      el.addEventListener('click',stop,true);
    }
    x0=null;dx=0;
  };
  el.addEventListener('pointerup',finish);
  el.addEventListener('pointercancel',finish);
  el.addEventListener('dragstart',e=>e.preventDefault());
}

const LEX={

mill:['自由','伤害','个性','讨论','多数','强制','发展','独立'],

const DIM_OF={bentham:[0],mill:[0,5],kant:[1],aristotle:[2],gilligan:[3],noddings:[3],scanlon:[4]};
function localAnalysis(){
  const txt=S.answers.join(' ');
  const seed=[...txt].reduce((a,c)=>a+c.charCodeAt(0),0);
  if(S.testKind==='choice'&&Array.isArray(S.picks)&&S.picks.length){
    const tally={};
    S.picks.forEach(id=>{tally[id]=(tally[id]||0)+1});
    const ranked=Object.entries(tally).sort((a,b)=>b[1]-a[1]||S.picks.lastIndexOf(b[0])-S.picks.lastIndexOf(a[0]));
    const best=ranked[0][0];
    const step=Math.round(80/S.picks.length);
    const dims=DIMS.map(()=>12);
    S.picks.forEach(id=>{(DIM_OF[id]||[]).forEach(i=>{dims[i]=Math.min(100,dims[i]+step)})});
    const names=ranked.map(([id,n])=>person(id).person+' '+n+' 次').join('，');
    const tied=ranked.filter(x=>x[1]===ranked[0][1]).map(x=>person(x[0]).person);
    const tieNote=tied.length>1?` ${tied.join('和')}票数相同，较后的题目更靠近${person(best).person}。`:'';
    return {id:best,similar:ranked.slice(1,3).map(x=>x[0]),tally:ranked.map(([id,n])=>({id,n})),dimensions:dims,reason:`这 ${S.picks.length} 道选择题按你点过的看法计票：${names}。票数最高的是${person(best).person}。${tieNote}这是选项汇总，不是性格测量。`,motto:person(best).keys.join(' / ')};
  }

  scores.sort((a,b)=>b.s-a.s);
  const best=scores[0].s>0?scores[0].id:BASE[seed%BASE.length].id;
  const idx=BASE.findIndex(x=>x.id===best);
  return {id:best,similar:scores.filter(x=>x.id!==best).slice(0,2).map(x=>x.id),dimensions:DIMS.map((_,i)=>35+(seed*(i+3)+idx*17)%55),reason:`这 ${testCount()} 轮里，你说过：“${(S.answers.find(a=>a.length>8)||S.answers[0]||'').slice(0,70)}”。本地匹配只看用词和这套立场的关注点是否靠近，不是测量。`,motto:'先说清你不愿抛弃谁。'};
}

function radarChart(values){

  const rings=[1,.75,.5,.25].map(t=>`<polygon points="${poly(t)}" fill="none" stroke="rgba(28,26,23,.22)"/>`).join('');
  const spokes=DIMS.map((_,i)=>{const [x,y]=at(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(28,26,23,.22)"/>`}).join('');
  const shape=DIMS.map((_,i)=>at(i,Math.max(0,Math.min(100,Number(values[i])||0))/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels=DIMS.map((name,i)=>{
    const [x,y]=at(i,1.36);
    const anchor=Math.abs(x-cx)<14?'middle':x<cx?'end':'start';
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="13" fill="#1c1a17" font-family="'Noto Serif SC',serif">${escapeHtml(name)} ${Math.round(Number(values[i])||0)}</text>`;
  }).join('');
  return `<figure class="radar"><svg viewBox="0 0 440 392" role="img" aria-label="六维雷达图">${rings}${spokes}<polygon points="${shape}" fill="rgba(44,70,201,.22)" stroke="#2c46c9" stroke-width="2" stroke-linejoin="round"/>${labels}</svg></figure>`;
}
function resultView(){
  if(!S.result)return `${header('伦理立场','做完一轮测试，会在这七位里找一个暂时最靠近的参照。')}<button class="primary" onclick="go('test')">开始测试</button>`;
  const p=person(S.result.id),r=S.result;
  const votes=(r.tally||[]).map(t=>person(t.id).person+' '+t.n+' 次').join(' · ');
  return `${header('一个暂时的参照','它说明你的回答更靠近谁的问题意识，不是给你发身份。')}<div class="profile"><div class="profile-card ${p.on==='#1c1a17'?'inked':''}" style="background:${p.color};color:${p.on}"><div class="tape">${p.en}</div><img class="portrait" src="${p.img}" alt="${p.person}"><h2>${p.person}</h2><p>${p.school} · ${p.years}</p><p>${escapeHtml(r.motto||p.keys.join(' / '))}</p></div><div class="panel dossier"><h2>为什么会靠近${p.person}</h2><p>${escapeHtml(r.reason)}</p>${votes?`<p class="muted">计票：${escapeHtml(votes)}</p>`:''}<h3>六维只是示意</h3>${radarChart(r.dimensions||[])}<p class="footer-note">这些数字不是量表分数。</p><p class="muted">还可以并读：${(r.similar||[]).map(id=>person(id).person).join(' · ')||'再听另外两位'}</p><div class="actions"><button class="primary small" onclick="S.figure='${p.id}';S.figureMsgs=[];go('hall')">和${p.person}谈谈</button><button class="outline small" onclick="restartTest();go('test')">再测一次</button></div></div></div>`
}
function hallView(){
  const p=person(S.figure);
  const msgs=S.figureMsgs.length?S.figureMsgs.map(m=>bubble(m,p.person)).join(''):`<div class="bubble"><span class="by">${escapeHtml(p.person)}</span>${escapeHtml(p.hello)}</div>`;
  const thinking=S.thinking?`<div class="bubble"><span class="by">${escapeHtml(p.person)}</span>正在想这一步…</div>`:'';
  const faces=lineup().map(x=>`<button class="face-pick ${x.id===p.id?'on':''}" type="button" onclick="pickFigure('${x.id}')" title="${escapeHtml(x.person)}"><img src="${x.img}" alt="${escapeHtml(x.person)}"></button>`).join('');
  const hints=ISSUES.map((issue,i)=>`<button class="hint" type="button" onclick="fillHall(${i})">${escapeHtml(issue.title)}</button>`).join('');
  return `<div class="workspace hall"><div class="side-col"><div class="portrait-stage" style="box-shadow:6px 6px 0 ${p.color}"><img src="${p.img}" alt="${escapeHtml(p.person)}"><div class="portrait-name">${escapeHtml(p.person)}</div></div><section class="bio-card"><div class="col-head"><h2>哲学家简介</h2><button class="outline small" type="button" onclick="S.profile='${p.id}';go('profile')">全文</button></div><p class="bio-meta">${escapeHtml(p.school)} · ${escapeHtml(p.years)}</p><div class="face-row">${faces}</div><div class="bio-scroll"><p>${escapeHtml(p.identity)}</p><p>${escapeHtml(p.ideas)}</p><p class="footer-note">${p.works.map(escapeHtml).join(' · ')}</p></div></section></div><section class="talk-card"><div class="chat" id="chatbox">${msgs}${thinking}</div></section><form class="dock" onsubmit="sendHall(event)"><div class="hints">${hints}</div><div class="send"><textarea id="hallInput" required placeholder="点一个气泡把议题放进输入框，或直接写你的处境" ${S.thinking?'disabled':''}></textarea><button class="primary" ${S.thinking?'disabled':''}>发送</button></div><p class="footer-note">模拟的是问题意识，不是本人发言，也不会编造原著引文。</p></form></div>`;
}
function pickFigure(id){S.figure=id;S.figureMsgs=[];render()}
function fillHall(i){const el=$('hallInput');if(el){el.value=ISSUES[i].ask;el.focus()}}
function fillAnswer(text){const el=$('answerBox');if(!el||el.disabled)return;if(!el.value.trim())el.value=text;el.focus()}
function fillLens(i){const idx=Math.min(S.answers.length,ISSUES.length-1);const lens=(ISSUES[idx].lenses||[])[i];if(lens)fillAnswer('从「'+lens+'」来看，')}
function personaPrompt(p){
  return `你在「思有引力」里陪当代用户思考。只依据${p.person}（${p.years}，${p.school}）的问题意识回应，不要舞台腔，不要声称自己是本人。
身份：${p.identity}
思想：${p.ideas}
著作只可点名，不可编造引文：${p.works.join('、')}
把握方式：${p.voice}
规则：
1. 中文，120到220字。
2. 必须接住用户刚刚这句话里的具体事情和用词。
3. 若已有你的上一轮，禁止换个问句重复。用户补了新内容，就要多一个分辨。
4. 不编造原著原文、数据和个人轶事。拿不准就直说。
5. 结尾只问一个问题，问题里要出现用户这句话中的某个词。
表述用「从${p.person}的想法来看」。`;
}
function hallContext(){return S.figureMsgs.filter(m=>m.role==='user'||m.role==='assistant').slice(-12)}
async function sendHall(e){
  e.preventDefault();if(S.thinking)return;
  const v=$('hallInput').value.trim();if(!v)return;
  S.figureMsgs.push({role:'user',content:v});S.thinking=true;render();
  const p=person(S.figure);let reply='';
  try{
    if(!S.online)throw new Error('offline');
    reply=await api([{role:'system',content:personaPrompt(p)},...hallContext()]);
  }catch(err){
    reply=userKey()?'这把密钥没能完成这次请求。请核对后再试。':(S.online?'这一轮没能连上模型，请再试一次。':'请先到「我的」填写你自己的 DeepSeek 密钥，再和'+p.person+'继续谈。\n\n'+p.hello);
    if(S.online)toast('模型暂不可用');
  }
  S.figureMsgs.push({role:'assistant',content:reply});
  if(S.figureMsgs.filter(x=>x.role==='user').length%3===0)addCoins(15);
  S.thinking=false;render();
}
function libraryView(){
  return `${header('哲学家','点开一位，看身份、思想、著作和轶事。这些文字同时是对话馆和辩论场的角色提示。')}<div class="scatter">${lineup().map(p=>posterCard(p,`S.profile='${p.id}';go('profile')`)).join('')}</div>`
}
function profileView(){
  const p=person(S.profile);
  return `${header(p.person,p.school+' · '+p.years)}<div class="profile"><div class="profile-card ${p.on==='#1c1a17'?'inked':''}" style="background:${p.color};color:${p.on}"><div class="tape">${p.en}</div><img class="portrait" src="${p.img}" alt="${p.person}"><h2>${p.person}</h2><p>${p.keys.join(' / ')}</p></div><div class="panel dossier"><h3>身份</h3><p>${p.identity}</p><h3>主要思想</h3><p>${p.ideas}</p><h3>著作</h3><ul class="works">${p.works.map(w=>`<li>${w}</li>`).join('')}</ul><h3>趣事</h3><p>${p.anecdote}</p><h3>谈话时会抓住什么</h3><p>${p.voice}</p><div class="actions"><button class="primary small" onclick="S.figure='${p.id}';S.figureMsgs=[];go('hall')">和${p.person}谈谈</button><button class="outline small" onclick="addDebater('${p.id}')">带去辩论场</button></div></div></div>`
}
function addDebater(id){if(!S.debaters.includes(id))S.debaters.push(id);S.debateReply=id;go('debate')}
function debateView(){
  return `${header('议题辩论场','先选一道题。进入之后再决定请哪几位思想家发言，房间会带上这道题的时代背景。')}<div class="issue-grid">${ISSUES.map(it=>issueCard(it,S.debateIssue===it.id?'当前议题':'ISSUE')).join('')}</div>`
}
function openIssue(id){if(S.debateIssue!==id)S.debateMsgs=[];S.debateIssue=id;if(!S.debaters.includes(S.debateReply))S.debateReply=S.debaters[0]||'kant';go('setup')}
function toggleDebater(id){
  if(S.debaters.includes(id))S.debaters=S.debaters.filter(x=>x!==id);
  else S.debaters.push(id);
  if(!S.debaters.includes(S.debateReply))S.debateReply=S.debaters[0]||'';
  render();
}
function setupView(){
  const it=issueOf(S.debateIssue);
  return `${header(it.title,'选至少两位思想家。边沁和密尔可以同时在场，他们并不说同一种功利。')}<div class="era" style="border-color:${it.color}"><span class="school-tag">${it.school}</span><strong>时代背景 · ${it.school}</strong><p class="muted">${it.era}</p><p>${it.scene}</p><p class="footer-note">这场在争：${it.tension}</p><p class="footer-note">议题里常见的其他标签：${it.lenses.join('、')}。发言的仍然只是你选中的这几位。</p></div>
  <div class="actions"><button class="primary" type="button" onclick="enterArena()">进入这一场辩论</button><button class="outline" type="button" onclick="go('debate')">换一道题</button><span class="muted">已选 ${S.debaters.length} 位，至少两位</span></div>
  <div class="people">${lineup().map(p=>{const on=S.debaters.includes(p.id);return `<button class="poster ${p.on==='#1c1a17'?'inked':''}${on?' picked':''}" style="background:${p.color};color:${p.on}" onclick="toggleDebater('${p.id}')" aria-pressed="${on}"><span class="school-tag">${p.school}</span><span class="vname">${on?'入选':p.en}</span><img class="face" src="${p.img}" alt="${p.person}"><h3>${p.person}</h3><p>${p.years}</p>${on?'<span class="tick" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.2 8.2 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>':''}</button>`}).join('')}</div>
  `
}
function enterArena(){if(S.debaters.length<2){toast('至少请两位思想家');return}if(!S.debaters.includes(S.debateReply))S.debateReply=S.debaters[0];go('arena')}
function debatePrompt(p,it){
  const cast=S.debaters.map(id=>person(id).person).join('、');
  return `你在「思有引力」的一场辩论里，只写${p.person}的发言。不要替其他在场者写台词，不要声称自己是历史本人。
议题：${it.title}
原题：${it.ask}
场景：${it.scene}
时代背景：${it.era}
这一场真正的张力：${it.tension}
你的把握方式：${p.voice}
思想约束：${p.ideas}
在场：${cast}
规则：
1. 中文，80到120字，短到能放进一个气泡。
2. 先接住这道题里的具体事实，再给出判断标准。
3. 若上文有别的发言，点出你和他在标准上哪里不同，不要嘲笑人。
4. 不编造引文和数据。古人没有写过的新技术，直接说你是在用旧标准看新情况。
5. 最后把话传给在场的另一位，或问用户一个包含议题关键词的问题。
用「从${p.person}的想法来看」起头。`;
}
function debateContext(){
  return S.debateMsgs.slice(-10).map(m=>({role:m.role==='user'?'user':'assistant',content:m.role==='user'?m.content:'【'+person(m.speaker).person+'】'+m.content}));
}
function localStance(p,it){
  return `从${p.person}的想法来看，「${it.title}」里我先抓住的是：${it.tension}。${p.voice}若要继续，请点另一位，看他是否接受这个标准。`;
}
function lastWord(id){for(let i=S.debateMsgs.length-1;i>=0;i--){const m=S.debateMsgs[i];if(m.role==='assistant'&&m.speaker===id)return m.content}return ''}
function lastUser(){for(let i=S.debateMsgs.length-1;i>=0;i--){if(S.debateMsgs[i].role==='user')return S.debateMsgs[i].content}return ''}
function roundSeats(cast){
  const n=cast.length;
  if(n===1) return [{p:cast[0],x:50,y:16,s:1.05}];
  const back=n>2?cast.slice(1,-1):[];
  const span=Math.min(124,28*Math.max(back.length,1)+24);
  const seats=back.map((p,i)=>{
    const t=back.length===1?0.5:i/(back.length-1);
    const a=(270-span/2+t*span)*Math.PI/180;
    const mid=1-Math.abs(t-0.5)*2;
    return {p,x:+(50+Math.cos(a)*32).toFixed(2),y:+(60+Math.sin(a)*38).toFixed(2),s:+(0.72+mid*0.22).toFixed(2)};
  });
  const yFront=n===2?18:32;
  const sFront=n<=3?1.02:1.08;
  return [{p:cast[0],x:n===2?22:12,y:yFront,s:sFront},...seats,{p:cast[n-1],x:n===2?78:88,y:yFront,s:sFront}];
}
function arenaView(){
  const it=issueOf(S.debateIssue);
  const cast=lineup().filter(p=>S.debaters.includes(p.id));
  const active=person(S.debaters.includes(S.debateReply)?S.debateReply:(cast[0]&&cast[0].id));
  const waiting=!lastWord(active.id);
  const line=S.thinking&&S.debateReply===active.id?'正在组织这一轮…':(lastWord(active.id)||'还没开口。点头像，请这位先说。');
  const mine=lastUser();
  const placed=roundSeats(cast);
  const busts=placed.map(s=>`<button class="round-seat" type="button" style="left:${s.x}%;top:${s.y}%;--s:${s.s}" onclick="speakAs('${s.p.id}')" ${S.thinking?'disabled':''} title="请${escapeHtml(s.p.person)}发言"><span class="bust"><img src="${s.p.img}" alt="${escapeHtml(s.p.person)}"></span></button>`).join('');
  const pills=placed.map(s=>`<button class="round-pill${Math.abs(s.x-50)<8?' high':''}${s.p.id===active.id?' on':''}" type="button" style="left:${s.x}%;top:${s.y}%;--s:${s.s}" onclick="speakAs('${s.p.id}')" ${S.thinking?'disabled':''}>${escapeHtml(s.p.person)}</button>`).join('');
  return `<div class="round">${busts}<section class="round-table"><h2>${escapeHtml(it.title)}</h2><p class="round-who">${escapeHtml(active.person)} · ${escapeHtml(active.school)}</p><p class="round-line${waiting&&!S.thinking?' wait':''}">${escapeHtml(line)}</p>${mine?`<p class="round-mine">你 · ${escapeHtml(mine)}</p>`:''}<form class="round-send" onsubmit="sendDebate(event)"><textarea id="debateInput" required placeholder="插一句，黄标的那位会回应" ${S.thinking?'disabled':''}></textarea><button class="primary" ${S.thinking?'disabled':''}>发送</button></form><button class="round-adjust" type="button" onclick="go('setup')">调整人选</button></section>${pills}</div>`
}
function chooseReply(id){S.debateReply=id;render()}
async function speakAs(id){
  if(S.thinking)return;
  if(!S.debaters.includes(id))return;
  S.debateReply=id;S.thinking=true;render();
  const p=person(id),it=issueOf(S.debateIssue);let reply='';
  try{
    if(!S.online)throw new Error('offline');
    reply=await api([{role:'system',content:debatePrompt(p,it)},...debateContext()]);
  }catch(err){
    reply=userKey()?'这把密钥没能完成这次发言。请核对后再试。':(S.online?'这一轮没能连上模型，请再试一次。':localStance(p,it));
    if(S.online)toast('模型暂不可用');
  }
  S.debateMsgs.push({role:'assistant',speaker:id,content:reply});
  if(S.debateMsgs.length%3===0)addCoins(10);
  S.thinking=false;render();
}
async function sendDebate(e){
  e.preventDefault();if(S.thinking)return;
  const v=$('debateInput').value.trim();if(!v)return;
  const who=S.debaters.includes(S.debateReply)?S.debateReply:S.debaters[0];
  S.debateMsgs.push({role:'user',content:v});
  S.thinking=true;render();
  const p=person(who),it=issueOf(S.debateIssue);let reply='';
  try{
    if(!S.online)throw new Error('offline');
    reply=await api([{role:'system',content:debatePrompt(p,it)},...debateContext()]);
  }catch(err){
    reply=userKey()?'这把密钥没能完成这次发言。请核对后再试。':(S.online?'这一轮没能连上模型，请再试一次。':localStance(p,it));
  }
  S.debateMsgs.push({role:'assistant',speaker:who,content:reply});
  S.thinking=false;render();
}
function meView(){
  const saved=!!userKey();
  return `${header('我的','记录只在这台浏览器里。')}<div class="layout2"><div class="panel"><h2>最近的参照</h2>${S.result?`<p class="serif" style="font-size:28px">${person(S.result.id).person}</p><p class="muted">${person(S.result.id).school}</p><button class="outline small" onclick="go('result')">查看</button>`:'<p class="muted">还没有完成哲学人格测试。</p><button class="primary small" onclick="go(\'test\')">去做测试</button>'}</div><div class="panel"><h2>密钥</h2><p class="muted">${saved?'当前使用你填写的密钥。粘贴新的可以覆盖。':'还没有密钥。对话和辩论只会给一句演示立场。'}</p><form class="keyform" onsubmit="saveUserKey();return false"><input id="userKey" type="password" autocomplete="off" spellcheck="false" placeholder="${saved?'已保存，可粘贴新密钥覆盖':'粘贴你的 DeepSeek 密钥'}"><button class="primary small" type="submit">使用</button><button class="outline small" type="button" onclick="clearUserKey()">清除</button></form><p class="footer-note">密钥只留在这台浏览器，请求时直接发给 DeepSeek，不会写进页面。</p><h2>数据</h2><p>思想火花 ${S.coins} · 完成测试 ${S.completed}</p><button class="outline small" onclick="if(confirm('清空这台设备上的测试、对话和辩论记录？')){localStorage.removeItem('phy_demo');location.reload()}">清除本地记录</button></div></div>`
}
async function status(){
  const hasKey=!!userKey();let proxy=false;
  try{const r=await fetch('/api/status');const j=await r.json();proxy=!!j.online}catch(e){}
  S.online=hasKey||proxy;
  $('apiDot').classList.toggle('on',S.online);
  $('apiState').textContent=hasKey?'使用你填写的密钥':(proxy?'本机服务已连接':'演示模式，密钥在「我的」');
  render();
}
status();
</script>
</body>
</html>
