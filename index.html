function home(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">A JOURNEY INTO YOUR MIND</div><h1>你的灵魂，<br>与哪位哲学家同频？</h1><p>在一次次选择与追问中，发现自己的思想底色。与哲学家交谈，让探索从此刻开始。</p><div class="actions"><button class="primary" onclick="go('test')">开启哲学人格测试 ↗</button><button class="outline" onclick="go('hall')">去哲学对话馆</button></div></div></div><div class="sectionhead"><h2>从这里开始思想冒险</h2><span>EXPLORE MORE →</span></div><div class="three"><div class="feature" onclick="go('test')"><div class="ico">✧</div><h3>发现哲学人格</h3><p>通过自由表达和 AI 追问，探索真正影响你选择的哲学价值。</p></div><div class="feature" onclick="go('hall')"><div class="ico">☷</div><h3>与哲学家对谈</h3><p>自由提问：关于幸福、自由、成长和生活里的困惑。</p></div><div class="feature" onclick="go('library')"><div class="ico">⌘</div><h3>收集思想图鉴</h3><p>阅读不同哲学家的思想，参与每日议题，解锁思想火花。</p></div></div><div class="sectionhead"><h2>今日哲学困境</h2><span>DAILY QUESTION</span></div>${dailyWidget()}`}
function dailyWidget(){let today=new Date().toLocaleDateString('sv-SE');return `<div class="quiz-box"><div class="eyebrow">QUESTION OF THE DAY</div><h3>如果一条善意的谎言，能让你珍视的人永远快乐，你会选择说出真相吗？</h3>${['会。真实本身就很重要。','不会。幸福与感受同样值得珍惜。','视具体情境而定，想先了解后果。'].map((t,i)=>`<div class="quiz-option" onclick="daily(${i})">${S.dailyDay===today&&S.dailyChoice===i?'✓ ':''}${t}</div>`).join('')}<p class="muted" id="dailyExplanation">${S.dailyDay===today?'从康德的义务伦理到后果主义，都可以提供不同的思考角度。':'选择一个答案，看看不同的哲学视角。'}</p></div>`}function daily(i){let d=new Date().toLocaleDateString('sv-SE');if(S.dailyDay!==d){addCoins(10)}S.dailyDay=d;S.dailyChoice=i;render()}
function testView(){if(S.ended)return resultView();let started=S.testMsgs.length>0;return `${header('哲学人格测试','给自己的思考留一点空间。这里没有标准答案，只有值得被倾听的你。')}<div class="layout2"><div class="panel"><h2>${started?'你的思想旅程':'选择你的探索深度'}</h2>${!started?`<p class="muted">你可以选择测试长度。AI 将在固定轮次内，依据你的回答调整问题，最后综合所有回答进行人格匹配。</p><div class="mode-grid">${[[6,'灵感速测','3–5 分钟'],[12,'标准探索','8–12 分钟'],[20,'深度哲思','15–20 分钟']].map(([n,label,t])=>`<button class="mode ${S.mode===n?'active':''}" onclick="S.mode=${n};render()"><strong>${label}</strong><small>${n} 轮 · ${t}</small></button>`).join('')}</div><button class="primary" onclick="startTest()">开始探索 · ${S.mode} 轮 ↗</button>`:`<div class="legend"><span>第 ${Math.min(S.turn+1,S.mode)} / ${S.mode} 轮</span><span>${Math.round(100*S.turn/S.mode)}%</span></div><div class="meter"><i style="width:${100*S.turn/S.mode}%"></i></div><div class="chat" id="chatbox">${S.testMsgs.map(m=>bubble(m)).join('')}${S.thinking?'<div class="bubble">正在梳理你的想法…</div>':''}</div><form class="send" onsubmit="sendAnswer(event)"><textarea id="answerBox" ${S.thinking?'disabled':''} placeholder="输入你的真实想法，表达多一点也没关系…" required></textarea><button class="primary" ${S.thinking?'disabled':''}>发送 ↗</button></form><div class="actions"><button class="outline small" onclick="restartTest()">重新开始</button><span class="muted">你的回答仅保存在当前设备（若启用 AI 则会用于请求模型）。</span></div>`}</div><div class="panel"><div class="portrait">✷</div><h2>思想探索小贴士</h2><p class="muted">不需要学习过哲学，也无需刻意回答得“正确”。你可以描述自己遇到的真实场景、感受和犹豫。</p><p class="notice">当前模式：<strong>${S.online?'DeepSeek AI 联网模式':'本地演示模式'}</strong><br>${S.online?'AI 将依据你的回答追问，测试结束后尝试给出解释性匹配。':'可体验完整流程；当前问题按设计好的情境顺序展开，结果仅供原型展示。'}</p></div></div>`}
const bubble=m=>`<div class="bubble ${m.role==='user'?'user':''}"><span class="by">${m.role==='user'?'我':'✧ 哲思引导者'}</span>${escapeHtml(m.content)}</div>`;
function startTest(){S.turn=0;S.answers=[];S.ended=false;S.result=null;S.testMsgs=[{role:'assistant',content:'欢迎来到思有引力。请放轻松，我们会通过生活中的情境探寻你的思考方式。\n\n第 1 轮 · '+QUESTIONS[0][1]+'\n'+QUESTIONS[0][0]}];go('test')}function restartTest(){S.testMsgs=[];S.answers=[];S.turn=0;S.ended=false;S.result=null;render()}
async function api(messages){let resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});let d=await resp.json();if(!resp.ok)throw new Error(d.error||'连接失败');return d.content}
async function sendAnswer(e){e.preventDefault();if(S.thinking)return;let el=$('answerBox');let ans=el.value.trim();if(!ans)return;S.answers.push(ans);S.testMsgs.push({role:'user',content:ans});S.turn++;S.thinking=true;render();try{if(S.turn>=S.mode){await finishTest()}else{let next=QUESTIONS[S.turn];let prompt=`你是哲学人格测评的温柔引导者。测评共${S.mode}轮，当前需要提出第${S.turn+1}轮问题。每轮只问一个问题，不要提前给出结果。根据用户上文，围绕「${next[1]}」生成一个自然、真实的生活情境问题，可与上轮建立联系。120字以内，不要选项。` ;let context=S.testMsgs.slice(-10).map(x=>({role:x.role,content:x.content}));let reply=S.online?await api([{role:'system',content:prompt},...context]):`第 ${S.turn+1} 轮 · ${next[1]}\n${next[0]}`;S.testMsgs.push({role:'assistant',content:reply})}}catch(e){toast('AI 暂不可用，已切换本地情境');S.testMsgs.push({role:'assistant',content:`第 ${S.turn+1} 轮 · ${QUESTIONS[S.turn][1]}\n${QUESTIONS[S.turn][0]}`})}finally{S.thinking=false;render()}}
const LEX={kong:['责任','家人','家庭','关系','礼','孝','和谐','互相'],lao:['顺其自然','放下','随缘','不强求','接受','自然'],zhuang:['自由','不拘','随心','自在','不同角度','可能'],mo:['帮助','平等','公平','所有人','行动','实用'],meng:['善良','良心','正义','道德','同情'],han:['规则','制度','秩序','惩罚','规范','法律'],su:['为什么','质疑','思考','反思','怀疑','问题'],ya:['理性','平衡','适度','中间','分析','习惯'],kang:['原则','底线','义务','尊严','应该','普遍'],mi:['结果','幸福','后果','利益','最多','减少伤害'],ni:['突破','创造','超越','自我','独特','挑战'],ma:['社会','环境','结构','现实','阶级','资源']};
function localAnalysis(){let txt=S.answers.join(' '),scores=BASE.map(p=>({id:p.id,s:LEX[p.id].reduce((a,w)=>a+(txt.split(w).length-1),0)}));scores.sort((a,b)=>b.s-a.s);let seed=[...txt].reduce((a,c)=>a+c.charCodeAt(0),0);let best=scores[0].s>0?scores[0].id:BASE[seed%BASE.length].id;let idx=BASE.findIndex(x=>x.id===best);return {id:best,similar:scores.filter(x=>x.id!==best).slice(0,2).map(x=>x.id),dimensions:DIMS.map((_,i)=>35+(seed*(i+3)+idx*17)%55),reason:`从本次 ${S.mode} 轮情境回答来看，你经常会思考选择背后的价值与影响。你曾表达：“${(S.answers.find(a=>a.length>10)||S.answers[0]||'').slice(0,75)}”。这与该人格原型的部分关注点相吻合。`,motto:'在每一次追问里，遇见更辽阔的自己。'}}
async function finishTest(){let result=localAnalysis();if(S.online){try{let raw=await api([{role:'system',content:'你是学术谨慎的哲学人格分析师。只依据用户所有回答匹配最相近的哲学家原型。候选id与人物：'+BASE.map(p=>p.id+':'+p.person).join('、')+'。请只返回JSON对象，禁止markdown：{"id":"候选id","similar":["候选id","候选id"],"dimensions":[55,55,55,55,55,55],"reason":"具体援引用户言论的160字中文分析，同时解释这是思想类比并非科学诊断","motto":"20字以内的原创哲学宣言"}。六维分数取0-100，勿假装心理测量有效性。'}, {role:'user',content:S.answers.map((a,i)=>`第${i+1}轮 [${QUESTIONS[i][1]}]：${a}`).join('\n')}]);let obj=JSON.parse(raw.replace(/```(?:json)?/g,'').trim());if(BASE.some(p=>p.id===obj.id)&&Array.isArray(obj.dimensions)&&obj.dimensions.length===6){result={...result,...obj};result.similar=(obj.similar||[]).filter(id=>BASE.some(x=>x.id===id)&&id!==obj.id).slice(0,2);result.dimensions=obj.dimensions.map(n=>Math.max(0,Math.min(100,Number(n)||50)))}}catch(e){toast('分析暂时不可用，使用本地匹配演示')}}S.result=result;S.ended=true;S.completed++;addCoins(50);S.page='result'}
function portraitCard(r){let p=BASE.find(x=>x.id===r.id)||BASE[0];return `<div class="ph-card" id="personaCard"><div class="seal">✧ PHILOSOPHICAL SOUL ✧</div><div class="ph-symbol">${p.icon}</div><div class="seal">YOUR PHILOSOPHICAL PERSONA</div><h2 class="serif">${p.name}</h2><div class="who">${p.person}型 · THE PHILOSOPHICAL SELF</div><div class="tags">${p.keys.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="quote">${escapeHtml(r.motto||p.desc)}</div><div class="seal" style="border-top:1px solid #c9b8a6;padding-top:18px;margin-top:15px">思有引力 · DISCOVER YOUR MIND</div></div>`}
function resultView(){if(!S.result)return `${header('你的哲学人格','完成一场测试即可解锁属于你的哲学人格。')}<button class="primary" onclick="go('test')">开始测试 ↗</button>`;let p=BASE.find(x=>x.id===S.result.id)||BASE[0],r=S.result;return `${header('你的哲学人格已揭晓','思想从不只有一种形状，而你拥有自己独特的观察世界的方式。')}<div class="result-grid"><div>${portraitCard(r)}<div class="result-actions"><button class="primary small" onclick="saveCard()">↓ 保存人格卡 PNG</button><button class="outline small" onclick="copyResult()">复制分享文案</button></div></div><div class="panel"><div class="eyebrow">YOUR PHILOSOPHICAL PROFILE</div><h2>与你最同频的是：${p.person}</h2><p class="muted">${p.desc}</p><h3 style="margin-top:25px;font-size:15px">你的思想光谱</h3>${DIMS.map((d,i)=>`<div class="barrow"><span>${d}</span><div class="bar"><i style="width:${r.dimensions[i]}%"></i></div><b>${r.dimensions[i]}</b></div>`).join('')}<p class="footer-note">这些数值用于呈现原型结果，不是经过心理测量验证的量表分数。</p><h3 style="margin:27px 0 12px;font-size:16px">为什么会匹配这个人格？</h3><p class="muted">${escapeHtml(r.reason)}</p><h3 style="font-size:16px">与你可能共鸣的思想者</h3><p class="muted">${r.similar.map(id=>BASE.find(x=>x.id===id)?.person).filter(Boolean).join(' · ')||'继续探索更多流派'}</p><div class="actions"><button class="primary small" onclick="S.figure='${p.id}';S.figureMsgs=[];go('hall')">和 ${p.person} 聊聊 ↗</button><button class="outline small" onclick="restartTest();go('test')">再次测试</button></div></div></div>`}
function hallView(){let p=BASE.find(x=>x.id===S.figure)||BASE[0];return `${header('哲学对话馆','邀请一位来自不同思想世界的向导，聊聊你真正关心的问题。')}<div class="layout2"><div class="panel"><h2>与 ${p.person} 对谈 <span style="font-weight:400;font-size:13px;color:#958a9d">· ${p.name}</span></h2><div class="chat" id="chatbox">${S.figureMsgs.length?S.figureMsgs.map(x=>bubble(x)).join(''):`<div class="bubble"><span class="by">✧ ${p.person} · AI 思想模拟</span>你好。我们可以聊聊自由、幸福、生活中的两难，或者任何让你感到好奇的事。你想从哪里开始？</div>`}${S.thinking?'<div class="bubble">正在思考这个问题…</div>':''}</div><div class="discussion">${['怎样才算真正的自由？','努力与幸福哪个更重要？','人应该坚持原则吗？'].map(t=>`<button class="chip" onclick="fillHall('${t}')">${t}</button>`).join('')}</div><form class="send" onsubmit="sendHall(event)"><textarea id="hallInput" required placeholder="把问题抛给思想家…" ${S.thinking?'disabled':''}></textarea><button class="primary" ${S.thinking?'disabled':''}>发送 ↗</button></form><p class="footer-note">AI 对历史思想的模拟演绎，并非哲学家真实发言。正式学习请结合原著。</p></div><div class="panel"><h2>选择一位思想家</h2><p class="muted">每位哲学家有不同的思考角度。</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${BASE.map(x=>`<button class="chip" style="border-color:${x.id===p.id?'#7653af':''};background:${x.id===p.id?'#e7dcf6':''}" onclick="pickFigure('${x.id}')">${x.icon} ${x.person}</button>`).join('')}</div></div></div>`}
function pickFigure(id){S.figure=id;S.figureMsgs=[];render()}function fillHall(t){$('hallInput').value=t;$('hallInput').focus()}
async function sendHall(e){e.preventDefault();if(S.thinking)return;let v=$('hallInput').value.trim();if(!v)return;S.figureMsgs.push({role:'user',content:v});S.thinking=true;render();let p=BASE.find(x=>x.id===S.figure);try{let sys=`你以${p.person}的哲学思想为依据，与当代用户进行轻松温暖但有思辨性的中文对话。关键词：${p.keys.join('、')}。避免生硬角色扮演和伪造引用；不确定的历史事实需说明。请回应用户问题，偶尔提出一个有启发性的追问，120-220字。`;let reply=S.online?await api([{role:'system',content:sys},...S.figureMsgs.slice(-14)]):`你问到了一个值得反复思考的问题。若从「${p.keys[0]}」出发，也许我们可以先看清自己最在意的是什么。${p.desc} 你觉得这件事中，哪一部分是你真正能够选择的？`;S.figureMsgs.push({role:'assistant',content:reply});if(S.figureMsgs.filter(x=>x.role==='user').length%3===0)addCoins(15)}catch(e){S.figureMsgs.push({role:'assistant',content:'我刚刚没能连上远方的思想馆。我们可以换个问题，或稍后再聊。'})}finally{S.thinking=false;render()}}
function libraryView(){return `${header('思想图鉴','从先秦到现代，看看这十二位思想家如何理解我们的世界。')}<div class="people">${BASE.map(p=>`<div class="person" onclick="pickFigure('${p.id}');go('hall')"><div class="face">${p.icon}</div><h3>${p.person} <span style="font-size:12px;color:#998da2;font-weight:400">/ ${p.name}</span></h3><p>${p.keys.join(' · ')}</p><p>${p.desc}</p><div style="margin-top:12px;font-size:12px;color:#7753a5">与 TA 对话 ↗</div></div>`).join('')}</div>`}
function meView(){return `${header('我的思想空间','保存在这台设备上的哲学探索记录。')}<div class="layout2"><div class="panel"><h2>我的哲学身份</h2>${S.result?`${portraitCard(S.result)}<div class="actions"><button class="primary small" onclick="go('result')">查看报告</button></div>`:'<div class="empty">你还没有生成哲学人格卡。<br><br><button class="primary" onclick="go(\'test\')">去做个测试</button></div>'}</div><div class="panel"><h2>探索数据</h2><div class="three" style="grid-template-columns:repeat(2,1fr)"><div class="feature" style="min-height:auto"><div class="ico">✦</div><h3>${S.coins}</h3><p>思想火花</p></div><div class="feature" style="min-height:auto"><div class="ico">✎</div><h3>${S.completed}</h3><p>完成测试</p></div></div><h3 style="margin-top:27px">数据与隐私</h3><p class="muted">本地演示数据存储在浏览器 localStorage 中。若使用 DeepSeek 模式，所发送的测试和对话内容将提交给该模型服务处理。请避免输入密码、身份证号等隐私信息。</p><button class="outline small" onclick="if(confirm('确认清空本设备的测试记录和积分？')){localStorage.removeItem('phy_demo');location.reload()}">清除本地数据</button></div></div>`}
function copyResult(){let p=BASE.find(x=>x.id===S.result.id);navigator.clipboard?.writeText(`我在「思有引力」测出的哲学人格是：${p.name} · ${p.person}型！\n${S.result.motto}`).then(()=>toast('分享文案已复制')).catch(()=>toast('复制暂不可用'))}
function saveCard(){if(!S.result)return;let p=BASE.find(x=>x.id===S.result.id),c=document.createElement('canvas');c.width=900;c.height=1200;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,900,1200);g.addColorStop(0,'#e5d5c2');g.addColorStop(.6,'#f8eddd');g.addColorStop(1,'#dfcbe6');x.fillStyle=g;x.fillRect(0,0,900,1200);x.strokeStyle='#b6a18f';x.lineWidth=3;x.strokeRect(48,48,804,1104);x.fillStyle='#8f735c';x.textAlign='center';x.font='28px serif';x.fillText('✧ PHILOSOPHICAL SOUL ✧',450,130);x.fillStyle='#816b9a';x.font='180px serif';x.fillText(p.icon,450,400);x.fillStyle='#514155';x.font='bold 76px serif';x.fillText(p.name,450,565);x.font='36px serif';x.fillText(p.person+'型',450,630);x.fillStyle='#7c6876';x.font='28px sans-serif';x.fillText(p.keys.join(' · '),450,740);x.font='26px sans-serif';let text=S.result.motto||p.desc;for(let i=0;i<Math.ceil(text.length/21);i++)x.fillText(text.slice(i*21,(i+1)*21),450,835+i*44);x.fillStyle='#8b765d';x.font='24px serif';x.fillText('思有引力  ·  DISCOVER YOUR MIND',450,1093);let a=document.createElement('a');a.download=`哲学人格-${p.name}.png`;a.href=c.toDataURL('image/png');a.click();toast('人格卡已保存')}
async function status(){try{let r=await fetch('/api/status');let j=await r.json();S.online=!!j.online}catch{S.online=false}$('apiDot').classList.toggle('on',S.online);$('apiState').textContent=S.online?'DeepSeek AI 已连接':'离线演示模式';render()};status();
